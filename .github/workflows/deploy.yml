name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 코드 가져오기
      - name: Checkout source
        uses: actions/checkout@v4

      # Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/davidjk522:cap2flask .

      # Docker Hub 업로드
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/davidjk522:cap2flask

      # 서버 배포
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/davidjk522:cap2flask

            docker stop myapp || true
            docker rm myapp || true

            docker run -d \
              --name myapp \
              -p 5000:5000 \
              --restart unless-stopped \
              -e KAKAO_API_KEY=${{ secrets.KAKAO_API_KEY }} \
              -e ODSAY_API_KEY=${{ secrets.ODSAY_API_KEY }} \
              ${{ secrets.DOCKER_USERNAME }}/davidjk522:cap2flask